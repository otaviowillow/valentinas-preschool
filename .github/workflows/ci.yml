name: CI

# Reliable PR build check (Node 22.16+ required by Astro 6 / Vite 7).
# Cloudflare Workers Builds on the repo also deploys; this workflow validates
# every PR independently of any duplicate/stale Cloudflare Git integrations.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
